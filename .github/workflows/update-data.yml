name: Check Rosstat wages
on:
  schedule:
    - cron: '17 3 * * 2'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl==3.1.5
      - run: python scripts/update.py
      - name: Commit changed values
        run: |
          if git diff --quiet -- data/salaries.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/salaries.json
          git commit -m "Update verified Rosstat wages"
          git push
